# yaml-language-server: $schema=https://raw.githubusercontent.com/squidfunk/mkdocs-material/master/docs/schema.json
site_name: Prototype AVT Metrics Taxonomy
site_description: Healthcare metrics taxonomy for assuring Ambient Voice
  Technology in NHS and comparable settings
site_url: https://dobsonrd.github.io/avt-metrics-taxonomy/
repo_url: https://github.com/dobsonrd/avt-metrics-taxonomy
repo_name: dobsonrd/avt-metrics-taxonomy
edit_uri: edit/main/taxonomy/

docs_dir: docs
site_dir: site

# Machine-readable downloads (CSV, JSON) live in docs/downloads/ and are
# copied verbatim by mkdocs. The monolithic Markdown archival copy is
# injected into site/downloads/ after mkdocs build so it's a pure download
# rather than getting treated as another page to render.

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - redirects:
      # v3.x → v4.0 page renames. Keys = old paths; values = new paths.
      # Preserves bookmarks for any reader who saved a deep link before
      # the rename.
      redirect_maps:
        groups/epr-write-back.md: groups/downstream-write-back.md
  - rss:
      match_path: "changelog\\.md"
      date_from_meta:
        # Read dates from page front-matter rather than git, because
        # docs/changelog.md is regenerated by build_site.py on every build
        # (so it's not git-tracked at the docs path). build_site.py injects
        # `date.created` and `date.updated` into the page meta from the
        # source CHANGELOG.md's git history.
        as_creation: date.created
        as_update: date.updated
      comments_path: ""
      length: 20

extra:
  # Version provider (mike) is not yet active — re-enable when we
  # actually deploy multi-version via mike. Until then, mkdocs-material's
  # dropdown fetches /versions.json from the URL prefix above site_url
  # (i.e. github.io root, not the project path), which 404s on local
  # serve and on a single-version production deploy. Keeping it disabled
  # avoids the 404 noise without losing any feature we currently use.
  #
  # version:
  #   provider: mike
  #   default: latest
  #   alias: true
  social:
    - icon: fontawesome/solid/rss
      link: /avt-metrics-taxonomy/feed_rss_updated.xml
      name: RSS - CHANGELOG updates
    - icon: fontawesome/brands/github
      link: https://github.com/dobsonrd/avt-metrics-taxonomy
      name: Source on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji ""
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.magiclink:
      hide_protocol: false
      repo_url_shortener: false
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

