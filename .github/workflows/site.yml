name: Build and deploy site

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python and dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests (pytest)
        run: uv run pytest

      - name: Run audit (fail build on any finding)
        run: uv run python taxonomy/audit.py

      - name: Build monolithic MD + CSV/JSON artefacts
        run: uv run python taxonomy/build.py

      - name: Populate docs/ from taxonomy source
        run: uv run python taxonomy/build_site.py

      - name: Copy CSV/JSON downloads into docs
        run: |
          mkdir -p docs/downloads
          cp dist/metrics.csv docs/downloads/
          cp dist/metrics.json docs/downloads/
          cp dist/gaps.json docs/downloads/
          cp dist/summary.json docs/downloads/
          cp avt-metrics-taxonomy.md docs/downloads/avt-metrics-taxonomy.txt

      - name: Dry-run build (PRs / feature branches)
        if: github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
        run: uv run mkdocs build

      - name: Configure git for mike
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898692+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true

      - name: Deploy `dev` alias from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          uv run mike deploy --push --update-aliases dev
          uv run mike set-default --push dev

      - name: Deploy tagged version as latest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest
